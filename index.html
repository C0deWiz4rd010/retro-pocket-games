<!doctype html>
<html lang="en" data-theme="cyberpunk" data-skin="launcher" data-shell="brick">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the last-used theme/skin before first paint (settings live in IndexedDB, which is
         async), so there is no flash of the wrong skin while the app boots. -->
    <script>
      try {
        var b = JSON.parse(localStorage.getItem('rp:boot') || 'null');
        if (b) {
          var d = document.documentElement.dataset;
          if (b.theme) d.theme = b.theme;
          if (b.skin) d.skin = b.skin;
          if (b.shell) d.shell = b.shell;
          if (b.fx) d.fx = b.fx;
        }
      } catch (e) {}
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <meta name="theme-color" content="#0a0a12" />
    <meta name="description" content="A pocket arcade — 85 retro games in one installable PWA." />
    <link rel="canonical" href="https://c0dewiz4rd010.github.io/retro-pocket-games/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Retro Pocket" />
    <meta property="og:title" content="Retro Pocket — 85 retro games" />
    <meta
      property="og:description"
      content="A pocket arcade in your browser — 85 retro classics, one installable PWA."
    />
    <meta property="og:url" content="https://c0dewiz4rd010.github.io/retro-pocket-games/" />
    <meta property="og:image" content="https://c0dewiz4rd010.github.io/retro-pocket-games/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Retro Pocket — 85 retro games" />
    <meta
      name="twitter:description"
      content="A pocket arcade in your browser — 85 retro classics, one installable PWA."
    />
    <meta name="twitter:image" content="https://c0dewiz4rd010.github.io/retro-pocket-games/icons/icon-512.png" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Retro Pocket" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/retro-pocket-games/favicon.svg" />
    <link rel="apple-touch-icon" href="/retro-pocket-games/icons/icon-192.png" />

    <!-- Self-hosted fonts (see src/styles/fonts.css); preload the two used on first paint. -->
    <link
      rel="preload"
      href="/retro-pocket-games/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/retro-pocket-games/fonts/press-start-2p-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Retro Pocket — 85 retro games</title>
  </head>
  <body>
    <div id="app" aria-live="polite">
      <!-- Pre-hydration splash so first paint isn't blank -->
      <div class="boot-splash">
        <div class="boot-splash__logo">RETRO&nbsp;POCKET</div>
        <div class="boot-splash__bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
