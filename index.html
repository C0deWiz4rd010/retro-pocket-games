<!doctype html>
<html lang="en" data-theme="cyberpunk" data-skin="console" data-shell="brick">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <meta name="theme-color" content="#0a0a12" />
    <meta name="description" content="A pocket arcade — 40 retro games in one installable PWA." />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Retro Pocket" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/retro-pocket-games/favicon.svg" />
    <link rel="apple-touch-icon" href="/retro-pocket-games/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />

    <title>Retro Pocket — 40 retro games</title>
  </head>
  <body>
    <div id="app" aria-live="polite">
      <!-- Pre-hydration splash so first paint isn't blank -->
      <div class="boot-splash">
        <div class="boot-splash__logo">RETRO&nbsp;POCKET</div>
        <div class="boot-splash__bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
